services:
  dxmon-adxo:
    build: .
    container_name: dxmon-adxo
    ports:
      - "8083:8083"
    restart: unless-stopped
    environment:
      - PORT=8083
      - WATCHED_FILE=/app/data/watched.json
      # - MIN_REFRESH_INTERVAL_SECONDS=3600   # override if needed
      # - FLASK_SECRET_KEY=some-random-string  # optional override; fine to leave default (LAN-only, no auth)
    volumes:
      - dxmon_data:/app/data

volumes:
  dxmon_data:
