; N4MI DXMon -- Waveshare ESP32-S3-Touch-LCD-4.3B
; PlatformIO port of the Arduino IDE reference stage confirmed working on real hardware 2026-08-27.
;
; Pinning philosophy: match the proven Arduino IDE reference exactly wherever possible, so that
; any behavior difference found here is a genuine toolchain issue, not a version confound.
;   - pioarduino platform 51.03.07 = Arduino core 3.0.7 (exact match to Arduino IDE core just proven)
;   - Library versions below = exactly what Arduino IDE's Library Manager had installed
;   - LVGL 8.4.0 = confirmed directly from the "Configuration file for v8.4.0" header comment
;     in the real lv_conf.h pulled from D:\Documents\Arduino\libraries\lv_conf.h

[env:waveshare-esp32s3-touch-lcd-43b]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; --- Board memory configuration ---
; Matches Arduino IDE Tools menu: Flash Size 16MB, PSRAM: OPI PSRAM
; ASSUMPTION FLAGGED: qio_opi assumes QUAD-I/O flash + OCTAL PSRAM. If Arduino IDE's Tools menu
; also shows a "Flash Mode" setting and it says OPI (not QIO), change memory_type to opi_opi.
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi

; --- Build flags ---
; ARDUINO_USB_CDC_ON_BOOT=1 matches Arduino IDE Tools > USB CDC on boot: Enabled
; LV_CONF_INCLUDE_SIMPLE + -Iinclude: our lv_conf.h lives in include/, not "next to the lvgl
; folder" the way Arduino IDE's convention placed it -- this is the PlatformIO-idiomatic way to
; point LVGL at a project-local config file instead.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

; --- Library versions ---
; Pinned to exactly what Arduino IDE's Library Manager had installed during the confirmed-working
; 2026-08-27 bring-up session, per Dan's direct report.
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.3.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bblanchon/ArduinoJson@7.4.3
